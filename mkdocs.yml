site_name: Dokumentácia semestrálnej práce
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src, tests]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Úvod: index.md
  - API Referencia:
      - Hlavný skript a základ: api/core.md
      - Spracovanie dát (Data Handling): api/data_handling.md
      - Modely (Models): api/models.md
      - Vyhodnotenie (Evaluation): api/evaluation.md
      - Vizualizácia (Visualization): api/visualization.md
      - Nástroje (Utils): api/utils.md
      - Testy (Tests): api/tests.md
