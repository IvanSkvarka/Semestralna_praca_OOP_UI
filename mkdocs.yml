site_name: Term Project Documentation
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src, tests]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Introduction: index.md
  - API Reference:
      - Main and Base: api/core.md
      - Data Handling: api/data_handling.md
      - Models: api/models.md
      - Evaluation: api/evaluation.md
      - Visualization: api/visualization.md
      - Utils: api/utils.md
      - Tests: tests.md
