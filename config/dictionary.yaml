names:
  # Feature columns
  volume: "Reactor volume"
  reactor_diameter: "Reactor diameter"
  liquid_height: "Liquid height"
  bottom_depth: "Bottom depth"
  n_impeller: "Number of impellers"
  diameter_impeller_1: "Impeller 1 diameter"
  ax_posImpeller_1: "Impeller 1 axial position"
  n_blades_1: "Impeller 1 blades"
  pitch_angle_1: "Impeller 1 pitch angle"
  diameter_impeller_2: "Impeller 2 diameter"
  ax_posImpeller_2: "Impeller 2 axial position"
  n_blades_2: "Impeller 2 blades"
  pitch_angle_2: "Impeller 2 pitch angle"
  diameter_impeller_3: "Impeller 3 diameter"
  ax_posImpeller_3: "Impeller 3 axial position"
  n_blades_3: "Impeller 3 blades"
  pitch_angle_3: "Impeller 3 pitch angle"
  n_diptubes: "Number of dip tubes"
  n_baffles: "Number of baffles"
  rpm: "Rotational speed $N$"
  # Target columns
  strainRate_p50: "Median strain rate"
  epsilon_p50: "Median turbulent dissipation"
  k_p50: "Median turbulent kinetic energy"
  Umag_p50: "Median velocity magnitude"



labels:
  # Feature columns
  volume: "$V$"
  reactor_diameter: "$D$"
  liquid_height: "$H$"
  bottom_depth: "$h_{\\mathrm{b}}$"
  n_impeller: "$N_{\\mathrm{imp}}$"
  diameter_impeller_1: "$d_1$"
  ax_posImpeller_1: "$z_1$"
  n_blades_1: "$n_{\\mathrm{b},1}$"
  pitch_angle_1: "$\\alpha_1$"
  diameter_impeller_2: "$d_2$"
  ax_posImpeller_2: "$z_2$"
  n_blades_2: "$n_{\\mathrm{b},2}$"
  pitch_angle_2: "$\\alpha_2$"
  diameter_impeller_3: "$d_3$"
  ax_posImpeller_3: "$z_3$"
  n_blades_3: "$n_{\\mathrm{b},3}$"
  pitch_angle_3: "$\\alpha_3$"
  n_diptubes: "$N_{\\mathrm{dt}}$"
  n_baffles: "$N_{\\mathrm{baf}}$"
  rpm: "$N$"
  # Target columns
  strainRate_p50: "$\\dot{\\gamma}_{\\mathrm{p50}}$"
  epsilon_p50: "$\\varepsilon_{\\mathrm{p50}}$"
  k_p50: "$k_{\\mathrm{p50}}$"
  Umag_p50: "$U_{\\mathrm{mag,p50}}$"



units:
  # Feature columns
  volume: "\\mathrm{L}"
  reactor_diameter: "\\mathrm{m}"
  liquid_height: "\\mathrm{m}"
  bottom_depth: "\\mathrm{m}"
  n_impeller: "-"
  diameter_impeller_1: "\\mathrm{m}"
  ax_posImpeller_1: "\\mathrm{m}"
  n_blades_1: "-"
  pitch_angle_1: "^\\circ"
  diameter_impeller_2: "\\mathrm{m}"
  ax_posImpeller_2: "\\mathrm{m}"
  n_blades_2: "-"
  pitch_angle_2: "^\\circ"
  diameter_impeller_3: "\\mathrm{m}"
  ax_posImpeller_3: "\\mathrm{m}"
  n_blades_3: "-"
  pitch_angle_3: "^\\circ"
  n_diptubes: "-"
  n_baffles: "-"
  rpm: "\\mathrm{min^{-1}}"
  # Target columns
  strainRate_p50: "\\mathrm{s^{-1}}"
  epsilon_p50: "\\mathrm{m^2\\,s^{-3}}"
  k_p50: "\\mathrm{m^2\\,s^{-2}}"
  Umag_p50: "\\mathrm{m\\,s^{-1}}"
