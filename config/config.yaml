data:
  feature_columns:
    - volume
    - reactor_diameter
    - liquid_height
    - bottom_depth
    - n_impeller
    - diameter_impeller_1
    - axPos_impeller_1
    - n_blades_1
    - pitch_angle_1
    - diameter_impeller_2
    - axPos_impeller_2
    - n_blades_2
    - pitch_angle_2
    - diameter_impeller_3
    - axPos_impeller_3
    - n_blades_3
    - pitch_angle_3
    - n_diptubes
    - n_baffles
    - rpm
  target_columns:
    - strainRate_p50
    - epsilon_p50
    - k_p50
    - Umag_p50

eda:
  correlation_method: "pearson"       # moznosti: "pearson", "spearman"
  correlation_threshold: 0.85         # prah pre upozornenie na multikolinearitu
  iqr_multiplier: 1.5                 # koeficient pre detekciu outlierov (1.5 * IQR)
  save_reports: true                  # ulozit tabulky so statistikami do report/