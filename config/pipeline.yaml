random_state: 42

eda:
  correlation_method: "pearson"
  correlation_threshold: 0.85
  iqr_multiplier: 1.5
  save_reports: true
  generate_plots: true

preprocessing:
  target: epsilon_p50
  group_columns: [reactor_diameter, liquid_height, n_impeller]
  log_target: true
  log_features: [volume, rpm, reactor_diameter, liquid_height]
  drop_duplicates: true
  drop_constant_columns: true
  save_reports: true
  generate_plots: true

evaluation:
  n_splits: 5
  save_reports: true
  generate_plots: true

tuning:
  n_splits: 3
  scoring: neg_root_mean_squared_error
  n_jobs: 4
  param_grids:
    GradientBoostingModel:
      n_estimators: [200, 300]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [1, 2, 3]
      min_samples_leaf: [1, 5]
      subsample: [0.7, 1.0]