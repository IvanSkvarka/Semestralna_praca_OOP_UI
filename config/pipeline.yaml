random_state: 42

eda:
  correlation_method: "pearson"       # moznosti: "pearson", "spearman"
  correlation_threshold: 0.85         # prah pre upozornenie na multikolinearitu
  iqr_multiplier: 1.5                 # koeficient pre detekciu outlierov (1.5 * IQR)
  save_reports: false                  # ulozit tabulky so statistikami do report/
  generate_plots: false

preprocessing:
  target: epsilon_p50
  group_columns: [reactor_diameter, liquid_height, n_impeller]
  log_target: true
  log_features: [volume, rpm, reactor_diameter, liquid_height]
  drop_duplicates: true
  drop_constant_columns: true
  save_reports: false
  generate_plots: false

evaluation:
  save_reports: true
  generate_plots: true

tuning:
  n_splits: 3
  scoring: neg_root_mean_squared_error
  n_jobs: 1
  param_grids:
    GradientBoostingModel:
      n_estimators: [50, 100, 200, 300, 400, 500]
      learning_rate: [0.01, 0.05, 0.1]
      max_depth: [2, 3, 4]